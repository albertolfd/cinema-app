name: Terraform apply

on:
  workflow_call:
    secrets:
      AWS_DEFAULT_REGION:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
    outputs:
      cinema_app_bucket_name:
        description: 'Name of the s3 bucket for this deployment'
        value: ${{ jobs.terraform.outputs.output1 }}
      cinema-app-distribution_id:
        description: 'Id of the cloufront distribution for this deployment'
        value: ${{ jobs.terraform.outputs.output2 }}
      cinema-app-distribution_domain_name:
        description: 'Domain name of the cloufront distribution for this deployment'
        value: ${{ jobs.terraform.outputs.output3 }}

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: production

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash
        working-directory: ./infrastructure

    env:
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    outputs:
      output1: ${{ steps.validate.outputs.cinema_app_bucket_name }}
      output2: ${{ steps.validate.outputs.cinema-app-distribution_id }}
      output3: ${{ steps.validate.outputs.cinema-app-distribution_domain_name }}

    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout
        uses: actions/checkout@v2

      - name: Get current branch
        run: echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_ENV

      # Install the latest version of Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_wrapper: false

      - name: Terraform Init & validate
        run: |
          terraform init
          terraform validate
          terraform fmt -check
        env:
          TF_WORKSPACE: ${{ env.BRANCH_NAME }}

      - name: Terraform Plan
        run: terraform plan
        env:
          TF_WORKSPACE: ${{ env.BRANCH_NAME }}

      - name: Terraform Apply
        id: validate
        #  if: github.ref == 'refs/heads/development' && github.event_name == 'push'
        run: |
          terraform apply -auto-approve
          mkdir -p outputs
          output=$(terraform output cinema_app_bucket_name)
          echo "::set-output name=cinema_app_bucket_name::$output"
          output=$(terraform output cinema-app-distribution_id)
          echo "::set-output name=cinema-app-distribution_id::$output"
          output=$(terraform output cinema-app-distribution_domain_name)
          echo "::set-output name=cinema-app-distribution_domain_name::$output"
        env:
          TF_WORKSPACE: ${{ env.BRANCH_NAME }}
