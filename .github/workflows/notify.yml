name: Slack notify

on:
  workflow_call:
    inputs:
      cinema-app-distribution_domain_name:
        required: true
        type: string
    secrets:
      SLACK_BOT_TOKEN:
        required: true

jobs:
  notify:
    name: 'Notify success on slack'
    runs-on: ubuntu-latest

    steps:
      - name: Get current branch
        run: echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_ENV

      - name: Set current date as env variable
        run: echo "NOW=$(date +'%Y-%m-%dT%H:%M:%S')" >> $GITHUB_ENV

      - name: Set current date as env variable
        run: echo "DISTRIBUTION_DOMAIN=${{ inputs.cinema-app-distribution_domain_name }}" >> $GITHUB_ENV

      - run: echo ${{ env.DISTRIBUTION_DOMAIN }}

      - name: Post to a Slack channel
        id: slack
        uses: slackapi/slack-github-action@v1.18.0
        with:
          # Slack channel id, channel name, or user id to post message.
          # See also: https://api.slack.com/methods/chat.postMessage#channels
          channel-id: 'cinema-circleci-dev'
          # For posting a simple plain text message
          payload: |
            {
                "text": "GitHub Action build result: ${{ job.status }}\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "Deployment to aws s3 and cloudfront is completed 🎉!",
                      "emoji": true
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Project*:\n${{ github.event.repository.name }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Branch*:\n${{ env.BRANCH_NAME }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*When*:\n${{ env.NOW }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Build*:\n${{ github.run_number }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Author*:\n${{ github.actor }}"
                      }
                    ],
                    "accessory": {
                      "type": "image",
                      "image_url": "https://i1.wp.com/thetempest.co/wp-content/uploads/2017/08/The-wise-words-of-Michael-Scott-Imgur-2.jpg?w=1024&ssl=1",
                      "alt_text": "alt text for image"
                    }
                  },
                  {
                    "type": "actions",
                    "elements": [
                      {
                        "type": "button",
                        "text": {
                          "type": "plain_text",
                          "text": "View Job"
                        },
                        "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                      },
                      {
                        "type": "button",
                        "text": {
                          "type": "plain_text",
                          "text": "Open app"
                        },
                        "url": "https://${{ env.DISTRIBUTION_DOMAIN }}"
                      }
                    ]
                  }
                ]
              }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
