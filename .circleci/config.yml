orbs:
  slack: circleci/slack@4.4.4

version: 2.1

executors:
  app-executor: # executor name. Free
    docker:
      - image: circleci/node:14.15.0
      - image: 'cibuilds/base:latest'
    resource_class: small
    working_directory: ~/repo
  slack-executor:
    docker:
      - image: 'cibuilds/base:latest'
    resource_class: small
  terraform-executor:
    docker:
      - image: hashicorp/terraform:latest
      - image: 'cibuilds/base:latest'
    resource_class: small
  docker-publisher:
    environment:
      IMAGE_NAME: albertolfd/cinemadb
    docker:
      - image: circleci/buildpack-deps:stretch

aliases:
  - &show-current-branch-name
    run:
      name: Show current branch
      command: echo ${CIRCLE_BRANCH}
  - &attach_workspace
    attach_workspace:
      at: ./
  - &install-aws-cli
    run:
      name: Install AWS CLI
      working_directory: /
      command: |
        sudo apt-get -y -qq update
        sudo apt-get install -y awscli
        sudo apt-get install -y python-pip python-dev build-essential
  - &notify-slack-failure-dev
    slack/notify:
      event: 'fail'
      channel: 'cinema-circleci-dev'
      template: 'basic_fail_1'
      branch_pattern: development
      mentions: '@albertolaragarcia'
  - &notify-slack-failure-stage
    slack/notify:
      event: 'fail'
      channel: 'cinema-circleci-stage'
      template: 'basic_fail_1'
      branch_pattern: stage
      mentions: '@albertolaragarcia'
  - &notify-slack-failure-prod
    slack/notify:
      event: 'fail'
      channel: 'cinema-circleci-prod'
      template: 'basic_fail_1'
      branch_pattern: master
      mentions: '@albertolaragarcia'

jobs:
  terraform-validate:
    executor: terraform-executor
    steps:
      - checkout
      - *show-current-branch-name
      - run:
          name: Terraform validate & format
          command: |
            cd infrastructure
            terraform init
            terraform validate
            terraform fmt -check
      - persist_to_workspace:
          root: ./
          paths:
            - infrastructure
      - *notify-slack-failure-dev
      - *notify-slack-failure-stage
      - *notify-slack-failure-prod

  terraform-plan-apply:
    executor: terraform-executor
    steps:
      - checkout
      - *attach_workspace
      - *show-current-branch-name
      - run:
          name: Terraform plan
          command: |
            cd infrastructure
            terraform workspace select ${CIRCLE_BRANCH} || terraform workspace new ${CIRCLE_BRANCH}       
            terraform plan
      # Hold-Approve step would be good
      - run:
          name: Terraform apply
          command: |
            cd infrastructure
            terraform workspace select ${CIRCLE_BRANCH}       
            terraform apply --auto-approve
            mkdir -p outputs
            terraform output cinema_app_bucket_name > outputs/cinema_bucket_name.txt
            terraform output cinema-app-distribution_id > outputs/cinema-app-distribution_id.txt
            terraform output cinema-app-distribution_domain_name > outputs/cinema-app-distribution_domain_name.txt
      - persist_to_workspace:
          root: ./
          paths:
            - infrastructure/outputs
      - *notify-slack-failure-dev
      - *notify-slack-failure-stage
      - *notify-slack-failure-prod

  terraform-destroy:
    executor: terraform-executor
    steps:
      - checkout
      - *attach_workspace
      - *show-current-branch-name
      - run:
          name: Terraform destroy
          command: |
            cd infrastructure
            terraform workspace select ${CIRCLE_BRANCH} || terraform workspace new ${CIRCLE_BRANCH}
            terraform destroy --auto-approve
      - *notify-slack-failure-dev
      - *notify-slack-failure-stage
      - *notify-slack-failure-prod

  install-dependencies:
    executor: app-executor
    steps:
      - checkout
      - *show-current-branch-name
      - restore_cache:
          key: app-{{ .Environment.CACHE_VERSION }}-{{ checksum "package.json"}}
      - run:
          name: Install dependencies
          command: yarn install
      - save_cache:
          paths:
            - node_modules
          key: app-{{ .Environment.CACHE_VERSION }}-{{ checksum "package.json"}}
      - persist_to_workspace:
          root: ./
          paths:
            - node_modules
      - *notify-slack-failure-dev
      - *notify-slack-failure-stage
      - *notify-slack-failure-prod

  lint:
    executor: app-executor
    steps:
      - checkout
      - *attach_workspace
      - *show-current-branch-name
      - run:
          name: Run lint
          command: yarn lint:fix
      - *notify-slack-failure-dev
      - *notify-slack-failure-stage
      - *notify-slack-failure-prod

  prettier:
    executor: app-executor
    steps:
      - checkout
      - *attach_workspace
      - *show-current-branch-name
      - run:
          name: Run prettier
          command: yarn prettier:fix
      - *notify-slack-failure-dev
      - *notify-slack-failure-stage
      - *notify-slack-failure-prod

  publish-docker-hub:
    executor: docker-publisher
    steps:
      - checkout
      - setup_remote_docker # from circleci
      - *attach_workspace
      - run: docker login -u "${DOCKER_HUB_USERNAME}" -p "${DOCKER_HUB_PASSWORD}"
      - run: docker build --build-arg REACT_APP_MOVIE_API_KEY=${REACT_APP_MOVIE_API_KEY} -t ${IMAGE_NAME}:latest .
      - run:
          name: Tag and push to docker hub
          command: |
            if [ "${CIRCLE_BRANCH}" == "master" ]
            then
              docker tag ${IMAGE_NAME}:latest ${IMAGE_NAME}:stable-${CIRCLE_BUILD_NUM} && docker push ${IMAGE_NAME}:stable-${CIRCLE_BUILD_NUM}
            elif [ "${CIRCLE_BRANCH}" == "stage" ]
            then
              docker tag ${IMAGE_NAME}:latest ${IMAGE_NAME}:stage-${CIRCLE_BUILD_NUM} && docker push ${IMAGE_NAME}:stage-${CIRCLE_BUILD_NUM}
            elif [ "${CIRCLE_BRANCH}" == "development" ]
            then
              docker tag ${IMAGE_NAME}:latest ${IMAGE_NAME}:dev-${CIRCLE_BUILD_NUM} && docker push ${IMAGE_NAME}:dev-${CIRCLE_BUILD_NUM}
            fi

  build:
    executor: app-executor
    steps:
      - checkout
      - *attach_workspace
      - *show-current-branch-name
      - run:
          name: Build project
          command: |
            yarn build
            cd build
            zip ../build.zip -r * .[^.]*
            echo "Build succesful"
      - persist_to_workspace:
          root: ./
          paths:
            - build
      - *notify-slack-failure-dev
      - *notify-slack-failure-stage
      - *notify-slack-failure-prod

  deploy-s3:
    executor: app-executor
    steps:
      - checkout
      - *attach_workspace
      - *show-current-branch-name
      - *install-aws-cli
      - run:
          name: Deploy to AWS S3
          command: |
            S3_BUCKET_NAME=$(cat infrastructure/outputs/cinema_bucket_name.txt | sed 's/\"//g')
            echo $S3_BUCKET_NAME
            aws --region ${AWS_REGION} s3 sync ~/repo/build s3://${S3_BUCKET_NAME} --delete
      - *notify-slack-failure-dev
      - *notify-slack-failure-stage
      - *notify-slack-failure-prod

  deploy-cloudfront:
    executor: app-executor
    steps:
      - checkout
      - *attach_workspace
      - *show-current-branch-name
      - *install-aws-cli
      - run:
          name: Deploy to AWS Cloudfront
          command: |
            CLOUDFRONT_DISTRIBUTION_ID=$(cat infrastructure/outputs/cinema-app-distribution_id.txt | sed 's/\"//g')
            echo $CLOUDFRONT_DISTRIBUTION_ID
            aws configure set preview.cloudfront true
            aws cloudfront create-invalidation --distribution-id ${CLOUDFRONT_DISTRIBUTION_ID} --paths /\*
      - *notify-slack-failure-dev
      - *notify-slack-failure-stage
      - *notify-slack-failure-prod

  notify-slack-dev:
    executor: slack-executor
    steps:
      - run: echo "Slack notification on dev"
      - *attach_workspace
      - run:
          name: Set distribution domain name
          command: |
            echo "export DISTRIBUTION_URL=\"$(cat infrastructure/outputs/cinema-app-distribution_domain_name.txt | sed 's/\"//g')\"" >> $BASH_ENV
      - run: echo $DISTRIBUTION_URL
      - slack/notify:
          event: 'pass'
          channel: 'cinema-circleci-dev'
          template: ''
          branch_pattern: development
          mentions: '@albertolaragarcia'
          custom: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Deployment to aws s3 and cloudfront is completed 🎉!",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Project*:\n${CIRCLE_PROJECT_REPONAME}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch*:\n${CIRCLE_BRANCH}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*When*:\n$(date +'%d/%m/%Y %T')"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Build*:\n${CIRCLE_BUILD_NUM}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author*:\n${CIRCLE_PROJECT_USERNAME}"
                    }
                  ],
                  "accessory": {
                    "type": "image",
                    "image_url": "https://i1.wp.com/thetempest.co/wp-content/uploads/2017/08/The-wise-words-of-Michael-Scott-Imgur-2.jpg?w=1024&ssl=1",
                    "alt_text": "alt text for image"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Job"
                      },
                      "url": "${CIRCLE_BUILD_URL}"
                    },
                    {                      
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Open app"
                      },
                      "url": "https://${DISTRIBUTION_URL}"
                    }
                  ]
                }
              ]
            }

  notify-slack-stage:
    executor: slack-executor
    steps:
      - run: echo "Slack notification on stage"
      - *attach_workspace
      - run:
          name: Set distribution domain name
          command: |
            echo "export DISTRIBUTION_URL=\"$(cat infrastructure/outputs/cinema-app-distribution_domain_name.txt | sed 's/\"//g')\"" >> $BASH_ENV
      - run: echo $DISTRIBUTION_URL
      - slack/notify:
          event: 'pass'
          channel: 'cinema-circleci-stage'
          template: ''
          branch_pattern: stage
          mentions: '@albertolaragarcia'
          custom: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Deployment to aws s3 and cloudfront is completed 🎉!",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Project*:\n${CIRCLE_PROJECT_REPONAME}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch*:\n${CIRCLE_BRANCH}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*When*:\n$(date +'%d/%m/%Y %T')"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Build*:\n${CIRCLE_BUILD_NUM}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author*:\n${CIRCLE_PROJECT_USERNAME}"
                    }
                  ],
                  "accessory": {
                    "type": "image",
                    "image_url": "https://i1.wp.com/thetempest.co/wp-content/uploads/2017/08/The-wise-words-of-Michael-Scott-Imgur-2.jpg?w=1024&ssl=1",
                    "alt_text": "alt text for image"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Job"
                      },
                      "url": "${CIRCLE_BUILD_URL}"
                    },
                    {                      
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Open app"
                      },
                      "url": "https://${DISTRIBUTION_URL}"
                    }
                  ]
                }
              ]
            }

  notify-slack-prod:
    executor: slack-executor
    steps:
      - run: echo "Slack notification on production"
      - *attach_workspace
      - run:
          name: Set distribution domain name
          command: |
            echo "export DISTRIBUTION_URL=\"$(cat infrastructure/outputs/cinema-app-distribution_domain_name.txt | sed 's/\"//g')\"" >> $BASH_ENV
      - run: echo $DISTRIBUTION_URL
      - slack/notify:
          event: 'pass'
          channel: 'cinema-circleci-prod'
          template: ''
          branch_pattern: master
          mentions: '@albertolaragarcia'
          custom: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Deployment to aws s3 and cloudfront is completed 🎉!",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Project*:\n${CIRCLE_PROJECT_REPONAME}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch*:\n${CIRCLE_BRANCH}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*When*:\n$(date +'%d/%m/%Y %T')"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Build*:\n${CIRCLE_BUILD_NUM}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author*:\n${CIRCLE_PROJECT_USERNAME}"
                    }
                  ],
                  "accessory": {
                    "type": "image",
                    "image_url": "https://i1.wp.com/thetempest.co/wp-content/uploads/2017/08/The-wise-words-of-Michael-Scott-Imgur-2.jpg?w=1024&ssl=1",
                    "alt_text": "alt text for image"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Job"
                      },
                      "url": "${CIRCLE_BUILD_URL}"
                    },
                    {                      
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "Open app"
                      },
                      "url": "https://${DISTRIBUTION_URL}"
                    }
                  ]
                }
              ]
            }

  deploy-heroku:
    executor: app-executor
    steps:
      - checkout
      - *show-current-branch-name
      - run:
          name: Deploy to Heroku
          command: |
            if [ "${CIRCLE_BRANCH}" == "master" ]
            then
              git push https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_PROD_APP}.git ${CIRCLE_BRANCH}:master -f
            elif [ "${CIRCLE_BRANCH}" == "stage" ]
            then
              git push https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_STAGE_APP}.git ${CIRCLE_BRANCH}:master -f
            elif [ "${CIRCLE_BRANCH}" == "development" ]
            then
              git push https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_DEV_APP}.git ${CIRCLE_BRANCH}:master -f
            fi

workflows:
  build_and_deploy:
    jobs:
      - terraform-validate:
          context: Slack
          filters:
            branches:
              only:
                - development
                - stage
                - master
      - terraform-plan-apply:
          context: Slack
          requires:
            - terraform-validate
          filters:
            branches:
              only:
                - development
                - stage
                - master
      - install-dependencies:
          context: Slack
      - lint:
          context: Slack
          requires:
            - install-dependencies
      - prettier:
          context: Slack
          requires:
            - install-dependencies
      - publish-docker-hub:
          requires:
            - prettier
          filters:
            branches:
              only:
                - development
                - stage
                - master
      # Heroku does not need the build job
      # - deploy-heroku:
      #     filters:
      #       branches:
      #         only:
      #           - development
      #           - stage
      #           - master
      - build:
          context: Slack
          requires:
            - lint
            - prettier
      - slack/on-hold:
          context: Slack
          requires:
            - build
          channel: 'cinema-circleci-prod'
          template: 'basic_on_hold_1'
          filters:
            branches:
              only:
                - master
      - pause_workflow:
          requires:
            - build
            - slack/on-hold
          filters:
            branches:
              only:
                - master
          type: approval
      - deploy-s3:
          context: Slack
          requires:
            - build
            - pause_workflow
            - terraform-plan-apply
          filters:
            branches:
              only:
                - development
                - stage
                - master
      - deploy-cloudfront:
          context: Slack
          requires:
            - deploy-s3
          filters:
            branches:
              only:
                - development
                - stage
                - master
      - notify-slack-dev:
          context: Slack
          requires:
            - deploy-cloudfront
          filters:
            branches:
              only:
                - development
      - notify-slack-stage:
          context: Slack
          requires:
            - deploy-cloudfront
          filters:
            branches:
              only:
                - stage
      - notify-slack-prod:
          context: Slack
          requires:
            - deploy-cloudfront
          filters:
            branches:
              only:
                - master
      # - terraform-destroy-hold:
      #     type: approval
      #     requires:
      #       - deploy-cloudfront
      # - terraform-destroy:
      #     context: Slack
      #     requires:
      #       - terraform-destroy-hold
      #     filters:
      #       branches:
      #         only:
      #           - development
      #           - stage
      #           - master
