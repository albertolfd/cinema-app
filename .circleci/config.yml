orbs:
  slack: circleci/slack@4.4.4

version: 2.1

executors:
  app-executor: # executor name. Free
    docker:
      - image: circleci/node:latest
    working_directory: ~/repo
  slack-executor:
    docker:
      - image: 'cibuilds/base:latest'
    resource_class: small

aliases:
  - &show-current-branch-name
    run:
      name: Show current branch
      command: echo ${CIRCLE_BRANCH}
  - &attach_workspace
    attach_workspace:
      at: ./
  - &install-aws-cli
    run:
      name: Install AWS CLI
      working_directory: /
      command: |
        sudo apt-get -y -qq update
        sudo apt-get install -y awscli
        sudo apt-get install -y python-pip python-dev build-essential


jobs:
  install-dependencies:
    executor: app-executor
    steps:
      - checkout
      - *show-current-branch-name
      - restore_cache:
          keys:
            - app-{{ checksum "package.json"}}
            - app-
      - run:
          name: Install dependencies
          command: npm install
      - save_cache:
          paths:
            - node_modules
          key: app-{{ checksum "package.json"}}
      - persist_to_workspace:
          root: ./
          paths: 
            - node_modules

  lint:
    executor: app-executor
    steps:
      - checkout
      - *attach_workspace
      - *show-current-branch-name
      - run:
          name: Run lint
          command: npm run lint:fix

  prettier:
    executor: app-executor
    steps:
      - checkout
      - *attach_workspace
      - *show-current-branch-name
      - run:
          name: Run prettier
          command: npm run prettier:fix

  build:
    executor: app-executor
    environment: 
      GIT_COMMIT_DESC: git log --format=%B -n 1 $CIRCLE_SHA1
    steps:
      - checkout
      - *attach_workspace
      - *show-current-branch-name
      - run:
          name: Build project
          command: |
            npm run build
            cd build
            zip ../build.zip -r * .[^.]*
            echo "Build succesful"            
      - persist_to_workspace:
          root: ./
          paths: 
            - build

  deploy-s3:
    executor: app-executor
    steps:
      - checkout
      - *attach_workspace
      - *show-current-branch-name
      - *install-aws-cli
      - run:
          name: Deploy to AWS S3
          command: |
            if [ "${CIRCLE_BRANCH}" == "master" ] 
            then
              aws --region ${AWS_REGION} s3 sync ~/repo/build s3://${AWS_PROD_BUCKET} --delete
            elif [ "${CIRCLE_BRANCH}" == "stage" ]
            then
              aws --region ${AWS_REGION} s3 sync ~/repo/build s3://${AWS_STAGE_BUCKET} --delete
            elif [ "${CIRCLE_BRANCH}" == "development" ]
            then
              aws --region ${AWS_REGION} s3 sync ~/repo/build s3://${AWS_DEV_BUCKET} --delete
            fi

  deploy-cloudfront:
    executor: app-executor
    steps:
      - checkout
      - *show-current-branch-name
      - *install-aws-cli
      - run:
          name: Deploy to AWS Cloudfront
          command: |
            aws configure set preview.cloudfront true
            if [ "${CIRCLE_BRANCH}" == "master" ] 
            then
              aws cloudfront create-invalidation --distribution-id ${PROD_DISTRIBUTION_ID} --paths /\*
            elif [ "${CIRCLE_BRANCH}" == "stage" ]
            then
              aws cloudfront create-invalidation --distribution-id ${STAGE_DISTRIBUTION_ID} --paths /\*
            elif [ "${CIRCLE_BRANCH}" == "development" ]
            then
              aws cloudfront create-invalidation --distribution-id ${DEV_DISTRIBUTION_ID} --paths /\*
            fi

  test:
    executor: app-executor
    environment: 
      GIT_COMMIT_DESC: git log --format=%B -n 1 $CIRCLE_SHA1
    steps:
      - run: echo "test my app"

  notify-slack:
    executor: slack-executor
    steps:
      - run: echo "Slack notification"
      - slack/notify:
          event: 'always'
          channel: 'cinema-circleci'
          template: ''
          branch_pattern: development
          mentions: '@albertolaragarcia'
          custom: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${CIRCLE_BRANCH} branch deployment to aws s3 and cloudfront is completed 🎉!",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  fields: [
                    {
                      "type": "mrkdwn",
                      "text": "*Project*:\n${CIRCLE_PROJECT_REPONAME}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch*:\n${CIRCLE_BRANCH}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*When*:\n${date + '%d/%m/%Y %T'}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Build*:\n${CIRCLE_BUILD_NUM}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author*:\n${CIRCLE_PROJECT_USERNAME}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit*:\n${GIT_COMMIT_DESC}"
                    }
                  ],
                  "accessory": {
                    "type": "image",
                    "image_url": "https://i1.wp.com/thetempest.co/wp-content/uploads/2017/08/The-wise-words-of-Michael-Scott-Imgur-2.jpg?w=1024&ssl=1",
                    "alt_text": "alt text for image"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Job",
                      },
                      "url": "${CIRCLE_BUILD_URL}"
                    }
                  ]
                }
              ]
            }

  deploy-heroku:
    executor: app-executor
    steps:
      - checkout
      - *show-current-branch-name
      - run:
          name: Deploy to Heroku
          command: |
            if [ "${CIRCLE_BRANCH}" == "master" ]
            then
              git push https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_PROD_APP}.git ${CIRCLE_BRANCH}:master -f
            elif [ "${CIRCLE_BRANCH}" == "stage" ]
            then
              git push https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_STAGE_APP}.git ${CIRCLE_BRANCH}:master -f
            elif [ "${CIRCLE_BRANCH}" == "development" ]
            then
              git push https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_DEV_APP}.git ${CIRCLE_BRANCH}:master -f
            fi


